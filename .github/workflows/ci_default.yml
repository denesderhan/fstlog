name: Default builds

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - '.editorconfig'
      - 'LICENSE'
      - '.github/**'
      - 'tests/**'
      - 'fstlog/include/fstlog/version.hpp'
  workflow_dispatch:  # Allow manual triggers
     
jobs:
  build:
    name: Default build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
           
    - name: Configure CMake
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFSTLOG_EXAMPLES=ON -DFSTLOG_TESTS=ON
                
    - name: Build
      run: cmake --build build --config Release

    - name: Install (Windows)
      if: runner.os == 'Windows'
      run: cmake --install build --config Release
      
    - name: Install (Unix)
      if: runner.os != 'Windows'
      run: sudo cmake --install build --config Release  

    - name: Verify Install (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Check using Powershell Test-Path
        # Check if the include files installed
        if (!(Test-Path -Path "./build/bin/Static/fstlog/include/fstlog/version.hpp")) {
          Write-Output "Error: Include files did not install!"
          exit 1
        }
        # Check if cmake files installed
        if (!(Test-Path -Path "./build/bin/Static/fstlog/lib/cmake/fstlog/fstlogConfig.cmake")) {
          Write-Output "Error: Cmake files did not install!"
          exit 1
        }
        # Check if lib files installed
        if (!(Test-Path -Path "./build/bin/Static/fstlog/lib/fstlog.lib")) {
          Write-Output "Error: Lib file did not install!"
          exit 1
        }
        Write-Output "Windows install verification passed."
          
    - name: Verify Install (Unix)
      if: runner.os != 'Windows'
      run: |
        # Run CMake find-package check and verify output contains "fstlog"
        CMAKE_OUTPUT=$(cmake --find-package -DNAME=fstlog -DCOMPILER_ID=GNU -DLANGUAGE=C -DMODE=EXIST 2>&1)
        if [[ ! "$CMAKE_OUTPUT" =~ "fstlog" ]]; then
          echo "Error: cmake --find-package did not find fstlog. Output: $CMAKE_OUTPUT"
          exit 1
        fi
        # Run pkg-config modversion check and verify it returns a version string like "x.yy.zzz"
        PKG_OUTPUT=$(pkg-config --modversion libfstlog 2>&1)
        if [[ ! "$PKG_OUTPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Error: pkg-config --modversion did not find fstlog. Output: $PKG_OUTPUT"
          exit 1
        fi
        echo "Unix install verification passed."
        
    - name: Run tests
      working-directory: ./build/tests
      run: ctest --output-on-failure
    
    - name: Run hello_world
      working-directory: ./build/bin/Static
      run: |
        ${{ runner.os == 'Windows' && '.\hello_world.exe' || './hello_world' }}
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: default-build-${{ runner.os }}
        path: |
          ./build/bin
          ./build/CMakeFiles/CMakeConfigureLog.yaml
          ./build/compile_commands.json
        retention-days: 5
